<!DOCTYPE html>
<html>
<head>
    <title>My Simple Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c2y9/iBD2k2VVih7FV3qIH76vcY/ziH70fmRZtZ+WY7NWq0WM2Rq6B7iVHI7T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C89scichPD0T6YITo1hWvX7YdwjA29h6j8+X7izAK9qBv1tBWr0XHGYe1IognT" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Simple Bank</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Accounts</a></li>
                <li><a href="#">Transactions</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Welcome to My Simple Bank</h2>
            <p>Your trusted partner for all your financial needs.</p>
            <button>Login</button>
            <button>Sign Up</button>
        </section>
    </main>
    
    <form>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" aria-describedby="usernameHelp">
          <div id="usernameHelp" class="form-text">Enter your username.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

    <footer>
        <p>&copy; 2023 My Simple Bank</p>
    </footer>

</body>
</html>
